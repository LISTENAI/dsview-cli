name: CI

on:
  workflow_dispatch:
    inputs:
      benchmark-arm64-deps:
        description: 'Cold-build ARM64 dependencies on an x64 runner (experiment only)'
        type: boolean
        default: false
  push:
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test-package:
    if: ${{ !inputs.benchmark-arm64-deps }}
    name: build-test-package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            package_bundle: true
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            package_bundle: true
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            package_bundle: true
          - target: aarch64-apple-darwin
            runner: macos-15
            package_bundle: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            msvc_arch: x64
            package_bundle: true
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            msvc_arch: arm64
            package_bundle: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Apply DSView local patches (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: ./scripts/apply-dsview-patches.sh

      - name: Apply DSView local patches (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        run: ./scripts/apply-dsview-patches.ps1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Python (Windows)
        if: contains(matrix.target, 'windows')
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.msvc_arch }}

      - name: Initialize MSVC developer command prompt
        if: contains(matrix.target, 'windows')
        uses: ./.github/actions/setup-msvc-dev-cmd
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Prepare Windows vcpkg cache directories
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          $BinaryCache = Join-Path $env:GITHUB_WORKSPACE ".cache\vcpkg\binary"
          $DownloadsCache = Join-Path $env:GITHUB_WORKSPACE ".cache\vcpkg\downloads"
          New-Item -ItemType Directory -Force -Path $BinaryCache | Out-Null
          New-Item -ItemType Directory -Force -Path $DownloadsCache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$BinaryCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DOWNLOADS=$DownloadsCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore Windows vcpkg cache
        id: vcpkg-cache
        if: contains(matrix.target, 'windows')
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/vcpkg/binary
            .cache/vcpkg/downloads
          key: windows-vcpkg-release-v1-${{ matrix.target }}-${{ env.VCToolsVersion }}-${{ hashFiles('ci/vcpkg/**', 'scripts/setup-windows-deps.ps1') }}
          restore-keys: |
            windows-vcpkg-release-v1-${{ matrix.target }}-${{ env.VCToolsVersion }}-

      - name: Setup native prerequisites
        uses: ./.github/actions/setup-native-prereqs
        with:
          target: ${{ matrix.target }}

      - name: Save Windows vcpkg cache
        if: contains(matrix.target, 'windows') && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/vcpkg/binary
            .cache/vcpkg/downloads
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Derive build version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "DSVIEW_BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build workspace
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run tests (Windows optimized)
        if: contains(matrix.target, 'windows')
        run: cargo test --workspace --profile ci-test --target ${{ matrix.target }}

      - name: Run tests (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Re-run Linux boundary diagnostics
        if: ${{ failure() && endsWith(matrix.target, '-unknown-linux-gnu') }}
        shell: bash
        env:
          MALLOC_CHECK_: "3"
          DSVIEW_DECODE_DEBUG: "1"
          PYTHONMALLOC: debug
          RUST_BACKTRACE: full
        run: |
          cargo test -p dsview-sys \
            --target ${{ matrix.target }} \
            --test boundary \
            -- --nocapture --test-threads=1

      - name: Find runtime library (Windows)
        if: matrix.package_bundle && contains(matrix.target, 'windows')
        id: find-runtime-windows
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "target/${{ matrix.target }}/release/build" -Recurse -Filter "dsview_runtime.dll" -ErrorAction Stop |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $runtime) {
            throw "Windows runtime library was not found under target/${{ matrix.target }}/release/build"
          }
          "runtime-lib=$runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Find decode runtime library (Windows)
        if: matrix.package_bundle && contains(matrix.target, 'windows')
        id: find-decode-runtime-windows
        shell: pwsh
        run: |
          $runtime = Get-ChildItem "target/${{ matrix.target }}/release/build" -Recurse -Filter "dsview_decode_runtime.dll" -ErrorAction Stop |
            Sort-Object FullName |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $runtime) {
            throw "Windows decode runtime library was not found under target/${{ matrix.target }}/release/build"
          }
          "runtime-lib=$runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Find runtime library (Unix)
        if: matrix.package_bundle && !contains(matrix.target, 'windows')
        id: find-runtime-unix
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"darwin"* ]] || [[ "${{ matrix.target }}" == *"macos"* ]]; then
            RUNTIME_LIB=$(find target/${{ matrix.target }}/release/build/dsview-sys-*/out/source-runtime-build -name "libdsview_runtime.dylib" -print -quit)
          else
            RUNTIME_LIB=$(find target/${{ matrix.target }}/release/build/dsview-sys-*/out/source-runtime-build -name "libdsview_runtime.so" -print -quit)
          fi
          if [[ -z "$RUNTIME_LIB" ]]; then
            echo "runtime library was not found for ${{ matrix.target }}" >&2
            exit 1
          fi
          echo "runtime-lib=$RUNTIME_LIB" >> "$GITHUB_OUTPUT"

      - name: Find decode runtime library (Unix)
        if: matrix.package_bundle && !contains(matrix.target, 'windows')
        id: find-decode-runtime-unix
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"darwin"* ]] || [[ "${{ matrix.target }}" == *"macos"* ]]; then
            RUNTIME_LIB=$(find target/${{ matrix.target }}/release/build/dsview-sys-*/out/source-decode-runtime-build -name "libdsview_decode_runtime.dylib" -print -quit)
          else
            RUNTIME_LIB=$(find target/${{ matrix.target }}/release/build/dsview-sys-*/out/source-decode-runtime-build -name "libdsview_decode_runtime.so" -print -quit)
          fi
          if [[ -z "$RUNTIME_LIB" ]]; then
            echo "decode runtime library was not found for ${{ matrix.target }}" >&2
            exit 1
          fi
          echo "runtime-lib=$RUNTIME_LIB" >> "$GITHUB_OUTPUT"

      - name: Determine executable path
        if: matrix.package_bundle
        id: exe-path
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            echo "exe=target/${{ matrix.target }}/release/dsview-cli.exe" >> $GITHUB_OUTPUT
          else
            echo "exe=target/${{ matrix.target }}/release/dsview-cli" >> $GITHUB_OUTPUT
          fi

      - name: Package and validate bundle
        if: matrix.package_bundle
        uses: ./.github/actions/package-and-validate
        with:
          target: ${{ matrix.target }}
          version: ${{ steps.version.outputs.version }}
          exe-path: ${{ steps.exe-path.outputs.exe }}
          runtime-path: ${{ contains(matrix.target, 'windows') && steps.find-runtime-windows.outputs.runtime-lib || steps.find-runtime-unix.outputs.runtime-lib }}
          decode-runtime-path: ${{ contains(matrix.target, 'windows') && steps.find-decode-runtime-windows.outputs.runtime-lib || steps.find-decode-runtime-unix.outputs.runtime-lib }}
          decoder-dir: DSView/libsigrokdecode4DSL/decoders

  benchmark-arm64-deps:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark-arm64-deps
    name: Cold ARM64 dependencies on x64 (experimental)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-msvc-dev-cmd
        with:
          arch: x64
      - name: Cross-build dependencies without caches
        shell: pwsh
        run: |
          $env:VCPKG_BINARY_SOURCES = 'clear'
          $env:VCPKG_DOWNLOADS = Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg/downloads'
          ./scripts/setup-windows-deps.ps1 -Target aarch64-pc-windows-msvc -HostTriplet x64-windows-release
      - name: Export ARM64 dependencies
        shell: pwsh
        run: |
          ./.cache/vcpkg/source/vcpkg.exe export glib:arm64-windows-release libusb:arm64-windows-release pkgconf:arm64-windows-release --raw --output=arm64-deps --output-dir="$env:GITHUB_WORKSPACE/.cache/exports"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg export failed' }
          tar -czf .cache/arm64-deps.tar.gz -C .cache/exports/arm64-deps .
          if ($LASTEXITCODE -ne 0) { throw 'Dependency archive failed' }
      - name: Upload ARM64 dependencies
        uses: actions/upload-artifact@v6
        with:
          name: arm64-cross-dependencies
          path: .cache/arm64-deps.tar.gz
          include-hidden-files: true
          retention-days: 7
      - name: Upload dependency build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arm64-cross-dependency-logs
          path: .cache/vcpkg/source/buildtrees/**/*.log
          include-hidden-files: true
          retention-days: 7

  validate-arm64-cross-deps:
    needs: benchmark-arm64-deps
    name: Validate cross-built dependencies on native ARM64
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Apply DSView local patches
        shell: pwsh
        run: ./scripts/apply-dsview-patches.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: ./.github/actions/setup-msvc-dev-cmd
        with:
          arch: arm64
      - uses: actions/download-artifact@v8
        with:
          name: arm64-cross-dependencies
          path: .cache/cross-artifact
      - name: Activate cross-built dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/cross-deps | Out-Null
          tar -xzf .cache/cross-artifact/arm64-deps.tar.gz -C .cache/cross-deps
          if ($LASTEXITCODE -ne 0) { throw 'Dependency extraction failed' }
          ./scripts/use-windows-deps.ps1 -VcpkgRoot .cache/cross-deps -Triplet arm64-windows-release
      - name: Build workspace
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Run tests
        run: cargo test --workspace --profile ci-test --target aarch64-pc-windows-msvc
      - name: Locate native runtimes
        id: runtimes
        shell: pwsh
        run: |
          $BuildRoot = 'target/aarch64-pc-windows-msvc/release/build'
          foreach ($Entry in @(@('capture', 'dsview_runtime.dll'), @('decode', 'dsview_decode_runtime.dll'))) {
            $Runtime = Get-ChildItem $BuildRoot -Recurse -Filter $Entry[1] | Select-Object -First 1 -ExpandProperty FullName
            if (-not $Runtime) { throw "Missing runtime: $($Entry[1])" }
            "$($Entry[0])=$Runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - uses: ./.github/actions/package-and-validate
        with:
          target: aarch64-pc-windows-msvc
          version: cross-benchmark-${{ github.run_id }}
          exe-path: target/aarch64-pc-windows-msvc/release/dsview-cli.exe
          runtime-path: ${{ steps.runtimes.outputs.capture }}
          decode-runtime-path: ${{ steps.runtimes.outputs.decode }}
          decoder-dir: DSView/libsigrokdecode4DSL/decoders
