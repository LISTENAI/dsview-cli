name: Windows ARM64

on:
  workflow_call:
    inputs:
      cold-build:
        description: Disable dependency cache restore/save for a cold benchmark
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  dependencies:
    name: Build ARM64 dependencies on x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-msvc-dev-cmd
        with:
          arch: x64
      - name: Prepare dependency caches
        id: cache-env
        shell: pwsh
        run: |
          "image=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $BinaryCache = Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg/binary'
          $DownloadsCache = Join-Path $env:GITHUB_WORKSPACE '.cache/vcpkg/downloads'
          New-Item -ItemType Directory -Force $BinaryCache, $DownloadsCache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$BinaryCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DOWNLOADS=$DownloadsCache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore dependency caches
        if: ${{ !inputs.cold-build }}
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/vcpkg/binary
            .cache/vcpkg/downloads
          key: windows-vcpkg-cross-v1-arm64-${{ env.VCToolsVersion }}-${{ steps.cache-env.outputs.image }}-${{ hashFiles('ci/vcpkg/**', 'scripts/setup-windows-deps.ps1') }}
          restore-keys: |
            windows-vcpkg-cross-v1-arm64-${{ env.VCToolsVersion }}-
      - name: Disable binary cache for cold benchmark
        if: inputs.cold-build
        shell: pwsh
        run: '"VCPKG_BINARY_SOURCES=clear" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - name: Build dependencies
        shell: pwsh
        run: ./scripts/setup-windows-deps.ps1 -Target aarch64-pc-windows-msvc -HostTriplet x64-windows-release
      - name: Save dependency caches
        if: ${{ !inputs.cold-build && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/vcpkg/binary
            .cache/vcpkg/downloads
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Export ARM64 dependencies
        shell: pwsh
        run: |
          ./.cache/vcpkg/source/vcpkg.exe export glib:arm64-windows-release libusb:arm64-windows-release pkgconf:arm64-windows-release --raw --output=arm64-deps --output-dir="$env:GITHUB_WORKSPACE/.cache/exports"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg export failed' }
          tar -czf .cache/arm64-deps.tar.gz -C .cache/exports/arm64-deps .
          if ($LASTEXITCODE -ne 0) { throw 'Dependency archive failed' }
      - name: Upload ARM64 dependencies
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64-dependencies
          path: .cache/arm64-deps.tar.gz
          include-hidden-files: true
          retention-days: 1
      - name: Upload dependency build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: arm64-cross-dependency-logs
          path: .cache/vcpkg/source/buildtrees/**/*.log
          include-hidden-files: true
          retention-days: 7

  build-test-package:
    needs: dependencies
    name: build-test-package (aarch64-pc-windows-msvc)
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Apply DSView local patches
        shell: pwsh
        run: ./scripts/apply-dsview-patches.ps1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - uses: ./.github/actions/setup-msvc-dev-cmd
        with:
          arch: arm64
      - uses: actions/download-artifact@v8
        with:
          name: windows-arm64-dependencies
          path: .cache/cross-artifact
      - name: Activate cross-built dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache/cross-deps | Out-Null
          tar -xzf .cache/cross-artifact/arm64-deps.tar.gz -C .cache/cross-deps
          if ($LASTEXITCODE -ne 0) { throw 'Dependency extraction failed' }
          ./scripts/use-windows-deps.ps1 -VcpkgRoot .cache/cross-deps -Triplet arm64-windows-release
      - name: Derive build version
        id: version
        shell: pwsh
        run: |
          $Version = if ($env:GITHUB_REF.StartsWith('refs/tags/')) { $env:GITHUB_REF.Substring(10) } else { $env:GITHUB_SHA.Substring(0, 7) }
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "DSVIEW_BUILD_VERSION=$Version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build workspace
        run: cargo build --release --target aarch64-pc-windows-msvc
      - name: Run tests
        run: cargo test --workspace --profile ci-test --target aarch64-pc-windows-msvc
      - name: Locate native runtimes
        id: runtimes
        shell: pwsh
        run: |
          $BuildRoot = 'target/aarch64-pc-windows-msvc/release/build'
          foreach ($Entry in @(@('capture', 'dsview_runtime.dll'), @('decode', 'dsview_decode_runtime.dll'))) {
            $Runtime = Get-ChildItem $BuildRoot -Recurse -Filter $Entry[1] | Select-Object -First 1 -ExpandProperty FullName
            if (-not $Runtime) { throw "Missing runtime: $($Entry[1])" }
            "$($Entry[0])=$Runtime" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
      - uses: ./.github/actions/package-and-validate
        with:
          target: aarch64-pc-windows-msvc
          version: ${{ steps.version.outputs.version }}
          exe-path: target/aarch64-pc-windows-msvc/release/dsview-cli.exe
          runtime-path: ${{ steps.runtimes.outputs.capture }}
          decode-runtime-path: ${{ steps.runtimes.outputs.decode }}
          decoder-dir: DSView/libsigrokdecode4DSL/decoders
